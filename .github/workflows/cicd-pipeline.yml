name: MVDS CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flask requests pytest pyyaml prometheus_client

      - name: Run unit tests
        run: python -m pytest tests/ -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan provider
        run: trivy fs src/provider/ --exit-code 1 --severity CRITICAL

      - name: Scan consumer
        run: trivy fs src/consumer/ --exit-code 1 --severity CRITICAL

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build provider image
        run: docker build -t provider-connector:latest src/provider/

      - name: Build consumer image
        run: docker build -t consumer-connector:latest src/consumer/

      - name: Verify images
        run: docker images | grep -E "provider-connector|consumer-connector"

  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate provider manifest
        run: |
          python -c "
          import yaml
          with open('k8s/provider/deployment.yaml') as f:
              docs = list(yaml.safe_load_all(f))
          print(f'Provider manifest valid - {len(docs)} documents')
          "

      - name: Validate consumer manifest
        run: |
          python -c "
          import yaml
          with open('k8s/consumer/deployment.yaml') as f:
              docs = list(yaml.safe_load_all(f))
          print(f'Consumer manifest valid - {len(docs)} documents')
          "

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: validate-manifests
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install flask requests pytest pyyaml prometheus_client

      - name: Record deploy start time
        run: echo "DEPLOY_START=$(date +%s.%N)" >> $GITHUB_ENV

      - name: Set up kind cluster
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind create cluster --name mvds-cluster

      - name: Build and load images
        run: |
          docker build -t provider-connector:latest src/provider/
          docker build -t consumer-connector:latest src/consumer/
          kind load docker-image provider-connector:latest --name mvds-cluster
          kind load docker-image consumer-connector:latest --name mvds-cluster

      - name: Create namespace
        run: kubectl create namespace mvds

      - name: Deploy metrics-server
        run: |
          kubectl apply -f k8s/monitoring/metrics-server.yaml
          kubectl rollout status deployment/metrics-server -n kube-system --timeout=60s
          sleep 30

      - name: Deploy provider
        run: kubectl apply -f k8s/provider/deployment.yaml

      - name: Deploy consumer
        run: kubectl apply -f k8s/consumer/deployment.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/provider-deployment -n mvds --timeout=120s
          kubectl rollout status deployment/consumer-deployment -n mvds --timeout=120s

      - name: Run pytest and save results
        run: python -m pytest tests/ -v --junitxml=results/pytest-output.xml || true

      - name: Functional validation
        run: |
          kubectl port-forward service/provider-service 8080:8080 -n mvds &
          kubectl port-forward service/consumer-service 8081:8081 -n mvds &
          sleep 10
          curl -f -H "X-Trial-Id: CI-${{ github.run_number }}" http://localhost:8080/health
          curl -f -H "X-Trial-Id: CI-${{ github.run_number }}" http://localhost:8081/health
          curl -f -H "X-Trial-Id: CI-${{ github.run_number }}" http://localhost:8081/run-full-flow

      - name: Record deploy end time and collect metrics
        run: |
          DEPLOY_END=$(date +%s.%N)
          python scripts/collect_metrics.py \
            --trial-id "CI-${{ github.run_number }}" \
            --condition automated \
            --start-time ${{ env.DEPLOY_START }} \
            --end-time $DEPLOY_END \
            --pytest-result results/pytest-output.xml

  deploy-monitoring:
    name: Deploy Monitoring Stack
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up kind cluster
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind create cluster --name mvds-cluster

      - name: Build and load application images
        run: |
          docker build -t provider-connector:latest src/provider/
          docker build -t consumer-connector:latest src/consumer/
          kind load docker-image provider-connector:latest --name mvds-cluster
          kind load docker-image consumer-connector:latest --name mvds-cluster

      - name: Create namespace and deploy applications
        run: |
          kubectl create namespace mvds
          kubectl apply -f k8s/provider/deployment.yaml
          kubectl apply -f k8s/consumer/deployment.yaml
          kubectl rollout status deployment/provider-deployment -n mvds --timeout=120s
          kubectl rollout status deployment/consumer-deployment -n mvds --timeout=120s

      - name: Pull and load monitoring images
        run: |
          docker pull prom/prometheus:v2.51.0
          docker pull grafana/grafana:10.4.0
          kind load docker-image prom/prometheus:v2.51.0 --name mvds-cluster
          kind load docker-image grafana/grafana:10.4.0 --name mvds-cluster

      - name: Deploy Prometheus
        run: kubectl apply -f k8s/monitoring/prometheus-deployment.yaml

      - name: Deploy Grafana
        run: kubectl apply -f k8s/monitoring/grafana-deployment.yaml

      - name: Wait for monitoring rollout
        run: |
          kubectl rollout status deployment/prometheus-deployment -n mvds --timeout=180s
          kubectl rollout status deployment/grafana-deployment -n mvds --timeout=180s

      - name: Verify metrics endpoints
        continue-on-error: true
        run: |
          kubectl port-forward service/provider-service 8080:8080 -n mvds &
          kubectl port-forward service/consumer-service 8081:8081 -n mvds &
          kubectl port-forward service/prometheus-service 9090:9090 -n mvds &
          sleep 15
          curl -sf http://localhost:8080/metrics | head -5
          curl -sf http://localhost:8081/metrics | head -5
          curl -sf http://localhost:9090/-/healthy
