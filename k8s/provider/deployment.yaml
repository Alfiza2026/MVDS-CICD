apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-deployment
  namespace: mvds
  labels:
    app: provider
    component: connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provider
  template:
    metadata:
      labels:
        app: provider
        component: connector
    spec:
      containers:
      - name: provider
        image: provider-connector:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: provider-service
  namespace: mvds
spec:
  selector:
    app: provider
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
