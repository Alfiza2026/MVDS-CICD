apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-deployment
  namespace: mvds
  labels:
    app: consumer
    component: connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
        component: connector
    spec:
      containers:
      - name: consumer
        image: consumer-connector:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8081
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: consumer-service
  namespace: mvds
spec:
  selector:
    app: consumer
  ports:
  - protocol: TCP
    port: 8081
    targetPort: 8081
  type: ClusterIP
