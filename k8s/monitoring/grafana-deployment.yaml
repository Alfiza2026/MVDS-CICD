apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: mvds
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: mvds
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-mvds
  namespace: mvds
data:
  mvds-connectors.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "title": "Provider Request Latency (p95)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "histogram_quantile(0.95, rate(provider_request_duration_seconds_bucket[5m]))", "legendFormat": "{{endpoint}}"}]
        },
        {
          "title": "Consumer Request Latency (p95)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "histogram_quantile(0.95, rate(consumer_request_duration_seconds_bucket[5m]))", "legendFormat": "{{endpoint}}"}]
        },
        {
          "title": "Provider Request Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{"expr": "rate(provider_requests_total[5m])", "legendFormat": "{{method}} {{endpoint}} {{status}}"}]
        },
        {
          "title": "Consumer Request Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{"expr": "rate(consumer_requests_total[5m])", "legendFormat": "{{method}} {{endpoint}} {{status}}"}]
        },
        {
          "title": "Pod CPU Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [{"expr": "rate(container_cpu_usage_seconds_total{namespace=\"mvds\"}[5m])", "legendFormat": "{{pod}}"}]
        },
        {
          "title": "Pod Memory Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [{"expr": "container_memory_usage_bytes{namespace=\"mvds\"}", "legendFormat": "{{pod}}"}]
        },
        {
          "title": "Connector Availability",
          "type": "stat",
          "gridPos": {"h": 4, "w": 24, "x": 0, "y": 24},
          "targets": [{"expr": "provider_up", "legendFormat": "Provider"}, {"expr": "consumer_up", "legendFormat": "Consumer"}]
        }
      ],
      "schemaVersion": 39,
      "tags": ["mvds", "connectors"],
      "time": {"from": "now-1h", "to": "now"},
      "title": "MVDS Connector Dashboard",
      "uid": "mvds-connectors"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
  namespace: mvds
  labels:
    app: grafana
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        component: monitoring
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.4.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        volumeMounts:
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboard-mvds
          mountPath: /var/lib/grafana/dashboards
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
      volumes:
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboards-provider
        configMap:
          name: grafana-dashboards-provider
      - name: grafana-dashboard-mvds
        configMap:
          name: grafana-dashboard-mvds
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: mvds
spec:
  selector:
    app: grafana
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: ClusterIP
